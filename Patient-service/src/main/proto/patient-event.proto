syntax = "proto3";

// These must be correct
package patient.events;

option java_multiple_files = true;
option java_package = "patient.events";
option java_outer_classname = "PatientEventProto";

message PatientEvent {
  string patient_id = 1;
  string name = 2;
  string email = 3;
  string event_type = 4;
}